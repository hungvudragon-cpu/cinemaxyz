<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background: Deep Midnight Cinema Canvas -->
    <linearGradient id="fav_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="100%" stop-color="#08090E"/>
    </linearGradient>

    <!-- Crimson Cinema Neon Gradient -->
    <linearGradient id="fav_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3843"/>
      <stop offset="40%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#9E050D"/>
    </linearGradient>

    <linearGradient id="fav_red_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#6E0006"/>
    </linearGradient>

    <filter id="fav_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E50914" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav_bg)" stroke="rgba(255,255,255,0.18)" stroke-width="1.8"/>

  <!-- High-contrast Bold T Monogram with Play Ribbon -->
  <g filter="url(#fav_glow)">
    <!-- T Top Wing (Sleek aerodynamic bar) -->
    <rect x="11" y="13" width="42" height="9" rx="3.5" fill="url(#fav_red)"/>
    <line x1="14" y1="14" x2="49" y2="14" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-linecap="round"/>

    <!-- T Vertical Stem -->
    <rect x="26" y="21" width="12" height="29" rx="3.5" fill="url(#fav_red_stem)"/>

    <!-- Integrated Play Icon in Crisp Pure White & Pearl Pink -->
    <path d="M31 25.5 C31 24.2 32.5 23.4 33.6 24.1 L48 33.1 C49.1 33.8 49.1 35.2 48 35.9 L33.6 44.9 C32.5 45.6 31 44.8 31 43.5 Z" fill="#FFFFFF"/>
    
    <!-- Play Accent Corner -->
    <polygon points="33,27 43,34.5 33,37" fill="#FFCCD0" opacity="0.8"/>
  </g>
</svg>
